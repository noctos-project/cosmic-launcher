[package]
name = "cosmic-launcher"
version = "1.11.0"
authors = ["Ashley Wulber <ashley@system76.com>"]
edition = "2024"
rust-version = "1.93"

[features]
default = ["wgpu"]
wgpu = ["libcosmic/wgpu"]
console = ["tokio/tracing"]

[profile.release]
lto = "thin"

[build-dependencies]
xdgen = "0.1.0"

[dependencies]
cosmic-launch = { git = "https://github.com/pop-os/libcosmic/", features = [
    "systemd",
    "tokio",
] }
console-subscriber = "0.5.0"
futures = "0.3.31"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
libcosmic = { git = "https://github.com/pop-os/libcosmic/", features = [
    "autosize",
    "dbus-config",
    "desktop",
    "winit",
    "multi-window",
    "wayland",
    "tokio",
    "single-instance",
    "xdg-portal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", default-features = false, features = [
    "std",
    "fmt",
    "env-filter",
] }
tracing-journald = "0.3.2"
tokio-stream = "0.1.18"
nix = { version = "0.31.1", features = ["process"] }
pop-launcher = { git = "https://github.com/pop-os/launcher/" }
pop-launcher-service = { git = "https://github.com/pop-os/launcher/" }
rust-embed = "8.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["sync", "rt"] }
clap = { version = "4.5.56", features = ["derive"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio"] }

# [patch."https://github.com/pop-os/libcosmic/"]
# cosmic-config = { git = "https://github.com/pop-os/libcosmic//", branch = "cosmic-launch" }
# cosmic-launch = { git = "https://github.com/pop-os/libcosmic//", branch = "cosmic-launch" }
# cosmic-theme = { git = "https://github.com/pop-os/libcosmic//", branch = "cosmic-launch" }
# libcosmic = { git = "https://github.com/pop-os/libcosmic//", branch = "cosmic-launch" }

# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }

# NoctOS: illumos needs the patched event-loop and Wayland transport crates
# carried in the cosmic-comp fork (same versions as pinned here). Expects
# that fork checked out next to this tree as ../cosmic-comp.
[patch.crates-io]
calloop = { path = "../cosmic-comp/noctos-vendor/calloop" }
polling = { path = "../cosmic-comp/noctos-vendor/polling" }
wayland-backend = { path = "../cosmic-comp/noctos-vendor/wayland-backend" }
# pulled in by softbuffer (software renderer); rustix has no ioctl opcode
# helpers on illumos
drm-ffi = { path = "../cosmic-comp/noctos-vendor/drm-ffi-0.7" }

# NoctOS: pop-os/winit at the pinned rev 9567503 plus an illumos arm for
# is_main_thread. Every crate of that workspace is redirected so the types
# stay identical across the dependency graph.
[patch."https://github.com/pop-os/winit.git"]
dpi = { path = "noctos-vendor/winit/dpi" }
winit = { path = "noctos-vendor/winit/winit" }
winit-android = { path = "noctos-vendor/winit/winit-android" }
winit-appkit = { path = "noctos-vendor/winit/winit-appkit" }
winit-common = { path = "noctos-vendor/winit/winit-common" }
winit-core = { path = "noctos-vendor/winit/winit-core" }
winit-orbital = { path = "noctos-vendor/winit/winit-orbital" }
winit-uikit = { path = "noctos-vendor/winit/winit-uikit" }
winit-wayland = { path = "noctos-vendor/winit/winit-wayland" }
winit-web = { path = "noctos-vendor/winit/winit-web" }
winit-win32 = { path = "noctos-vendor/winit/winit-win32" }
winit-x11 = { path = "noctos-vendor/winit/winit-x11" }

# NoctOS: pop-os/softbuffer (tag cosmic-4.0, c2b2c19) with a POSIX-correct
# shm_open name.
[patch."https://github.com/pop-os/softbuffer"]
softbuffer = { path = "noctos-vendor/softbuffer" }
